[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proinxml"
version = "1.0.0"
description = "Integracion de XML del MEF con SQL Server y auditoria"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyodbc>=5,<6",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.18,<1",
  "argon2-cffi>=23.1,<26",
]

[dependency-groups]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
cache-dir = ".runtime/uv-cache"
